<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Registrale</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1c1917">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/tailwind.config.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/registrale.css">
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <main class="w-full max-w-sm">
        <div class="flex items-center gap-3 mb-8">
            <span class="brand-mark" aria-hidden="true">R</span>
            <div>
                <h1 class="text-lg font-semibold tracking-tight leading-tight">Registrale</h1>
                <p class="text-xs text-stone-500 dark:text-stone-400">Monitoramento do Diário Oficial</p>
            </div>
        </div>

        <div class="card card-body">
            {% if error %}
            <div class="badge-danger flex items-center gap-2 text-sm p-3 rounded-lg border mb-5" role="alert">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label for="username" class="field-label">Usuário</label>
                    <input id="username" type="text" name="username" required autocomplete="username" autofocus class="input">
                </div>
                <div>
                    <label for="password" class="field-label">Senha</label>
                    <input id="password" type="password" name="password" required autocomplete="current-password" class="input">
                </div>
                <button type="submit" class="btn btn-primary w-full mt-2">Entrar</button>
            </form>
        </div>

        <p class="mt-6 text-xs text-stone-500 dark:text-stone-400">Acesso restrito a usuários autorizados.</p>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
