<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Registrale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        html.dark ::-webkit-scrollbar-track {
            background: #1c1917;
        }
        html.dark ::-webkit-scrollbar-thumb {
            background: #44403c;
            border-radius: 4px;
        }
        /* Sistema Harmonizado de Sombras (Soft & Premium) */
        .shadow-xs { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04); }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.04); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.03); }
        .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04); }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.16); }
        
        /* Dark Mode Shadows Harmonizadas */
        html.dark .shadow-xs { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.35) !important; }
        html.dark .shadow-sm { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.35) !important; }
        html.dark .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.35), 0 2px 4px -2px rgba(0, 0, 0, 0.2) !important; }
        html.dark .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.2) !important; }
        html.dark .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.45), 0 8px 10px -6px rgba(0, 0, 0, 0.25) !important; }
        html.dark .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55) !important; }
    </style>
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-stone-950 text-slate-900 dark:text-stone-100 flex items-center justify-center min-h-screen p-4 transition-colors duration-200">
    <div class="bg-white dark:bg-stone-900 p-8 sm:p-10 rounded-3xl shadow-md border border-slate-100 dark:border-stone-800 w-full max-w-md transition-colors">
        <div class="text-center mb-8">
            <div class="bg-slate-900 dark:bg-stone-100 text-white dark:text-stone-900 rounded-2xl p-3 inline-block shadow-sm mb-4 border border-transparent dark:border-stone-200">
                <i data-lucide="bot-message-square" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Registrale</h1>
            <p class="text-slate-400 dark:text-stone-400 text-xs font-bold mt-1 uppercase tracking-widest">Monitor DOU</p>
        </div>

        {% if error %}
        <div class="bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-900/60 text-red-600 dark:text-red-300 text-xs font-bold p-4 rounded-xl mb-6 flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="text-[10px] font-bold text-slate-400 dark:text-stone-400 uppercase tracking-widest ml-1">Usuário</label>
                <input type="text" name="username" required placeholder="admin" class="w-full p-3 bg-slate-50 dark:bg-stone-800/80 border border-slate-200 dark:border-stone-700 text-slate-900 dark:text-stone-100 placeholder-slate-400 dark:placeholder-stone-500 rounded-xl text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 transition-all">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 dark:text-stone-400 uppercase tracking-widest ml-1">Senha</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 bg-slate-50 dark:bg-stone-800/80 border border-slate-200 dark:border-stone-700 text-slate-900 dark:text-stone-100 placeholder-slate-400 dark:placeholder-stone-500 rounded-xl text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 transition-all">
            </div>
            <button type="submit" class="w-full bg-slate-900 dark:bg-stone-100 text-white dark:text-stone-900 py-3.5 rounded-xl font-bold hover:bg-slate-800 dark:hover:bg-white transition-all shadow-sm hover:shadow-md active:scale-95 border border-transparent dark:border-stone-200">
                Entrar no Sistema
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-slate-400 dark:text-stone-500 font-medium">Acesso restrito a usuários autorizados</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
