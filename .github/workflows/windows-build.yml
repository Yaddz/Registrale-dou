name: Windows Installer Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/modo-local
  pull_request:
    branches:
      - main
      - feature/modo-local

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --group windows

      - name: Run local test suite
        run: uv run pytest -m "not live" -q

      - name: Smoke test outside pytest (imports + server /login)
        shell: pwsh
        run: |
          uv run python -c "from rodou_dashboard.app.runtime.runner import _build_default_searchers; s = _build_default_searchers(); assert 'INLABS_FALLBACK' in s and 'INLABS' in s; print('Searchers OK')"
          $env:REGISTRALE_DATA_DIR = "$env:TEMP\registrale_smoke"
          $proc = Start-Process -FilePath "uv" -ArgumentList "run","registrale","--port","5099" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:5099/login" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Smoke server /login did not respond HTTP 200" }
            Write-Host "Smoke server /login OK"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              & taskkill /T /F /PID $proc.Id 2>$null | Out-Null
            }
            Remove-Item -Recurse -Force $env:REGISTRALE_DATA_DIR -ErrorAction SilentlyContinue
          }

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: .\windows\build.ps1

      - name: Upload installer artifact and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: registrale-windows-installer
          path: |
            dist/Registrale-Setup-*.exe
            dist/Registrale-Setup-*.exe.sha256
          if-no-files-found: error
